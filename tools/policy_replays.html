<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新 best · 10 张地图回放</title>
<style>
:root{color-scheme:dark;--bg:#0e1726;--panel:#162337;--line:#30435a;--ink:#f0f5fc;--muted:#a7b7cc;--a:#36d6b3;--b:#ff9477}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1480px;margin:auto;padding:28px}h1{margin:0 0 8px;font-size:30px}p{margin:8px 0;color:var(--muted)}.badge{display:inline-block;background:#26394b;padding:2px 10px;border-radius:6px;font-size:13px}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}button,select,a.link{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}nav button{text-align:left}nav button[aria-pressed=true]{border-color:var(--a);box-shadow:0 0 0 1px var(--a)}nav small{display:block;color:var(--muted)}.ok{color:#6de0a0}.bad{color:#ff7885}.grid{display:grid;grid-template-columns:minmax(0,1fr) 260px 260px;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}h2{font-size:17px;margin:0 0 12px}canvas{display:block;width:100%;background:#08101b;border-radius:8px}#follow{aspect-ratio:720/620}#whole{aspect-ratio:320/480}#input{image-rendering:pixelated;aspect-ratio:1}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}.controls input{flex:1;min-width:200px;accent-color:var(--a)}.controls .time{font-variant-numeric:tabular-nums;font-size:14px}dl{display:grid;grid-template-columns:1fr auto;gap:9px;margin:18px 0 6px}dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}.action{font-size:21px;font-weight:700;margin:15px 0}.note{font-size:13px}details{margin:24px 0;color:var(--muted)}a{color:#80caff}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffd382;outline-offset:3px}@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) 230px}.observation{grid-column:1/-1;display:grid;grid-template-columns:240px 1fr;gap:20px}.observation h2{grid-column:1/-1}.observation dl{margin-top:0}}@media(max-width:650px){.wrap{padding:16px}nav{grid-template-columns:repeat(2,1fr)}.grid{display:block}.panel{margin-bottom:14px}.observation{display:block}#whole{max-height:360px}.controls input{flex-basis:100%}}
</style>
<main class="wrap"><header><span class="badge">合成仿真 · 新 best</span><h1>10 张地图，完整驾驶回放</h1><p><span id="selection-note"></span></p></header>
<nav id="cases" aria-label="选择地图"></nav>
<div class="grid"><section class="panel"><h2 id="title">跟随视图 · A 向上，B 向右</h2><canvas id="follow" width="720" height="620"></canvas><div class="controls"><button id="play">播放</button><button id="restart">从头</button><select id="speed" aria-label="播放速度"><option value=".25">0.25 倍</option><option value=".5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option><option value="4">4 倍</option></select><span id="clock" class="time"></span><input id="scrub" type="range" min="0" step="0.001" value="0" aria-label="回放时间轴"></div><div class="controls"><button id="ending">看完整轨迹</button><button id="switch">下次按键切换</button><button id="jump">下次起跳／落地</button><a id="video" class="link">查看视频</a></div><p class="note">绿色轨迹＝松开；橙色轨迹＝按住。棕色为上凸，蓝色为整幅下凹；起伏区域仍是完整路面。浅蓝线为跳跃落地点。</p></section>
<section class="panel"><h2>全图与已行驶轨迹</h2><canvas id="whole" width="320" height="480"></canvas><p id="result"></p></section>
<section class="panel observation"><h2>模型实际输入</h2><div><canvas id="input" width="288" height="288"></canvas><p class="note">白：道路；黑：空缺／非路面；灰：未知。箭头为模型估计的方向。</p></div><div><div id="action" class="action"></div><dl id="stats"></dl><p id="endnote" class="note"></p></div></section></div>
<details><summary>取样与回放说明</summary><p><span id="replay-note"></span>页面中的观测图是模型实际收到的输入；左侧与全图显示仿真的道路真值。模型及仿真均未为本页调整。</p><p id="model"></p><a href="overview.png">打开十张地图总览</a> · <a href="compilation.mp4">播放全部十张视频（2 倍速）</a></details>
</main><script>
const DATA=__REPLAY_DATA__;
for(const c of DATA.cases)c.rects=c.rects.filter(v=>v.every(x=>Number.isFinite(x)&&Math.abs(x)<1e8)&&v[2]>v[0]&&v[3]>v[1]);
const F=Object.fromEntries(DATA.fields.map((v,i)=>[v,i])),$=id=>document.getElementById(id);
let selected=0,now=0,playing=false,lastStamp=null,sprite=new Image();
const cases=DATA.cases;document.title=(DATA.model_name||'best')+' · 10 张地图回放';document.querySelector('.badge').textContent='合成仿真 · '+(DATA.model_name||'best');const passed=cases.filter(c=>c.finished).length;$('selection-note').textContent=`按类型及结果分层选取：${passed} 张通过、${cases.length-passed} 张失败。包含整幅起伏路面；这些示例不代表通过率。`;$('replay-note').textContent=`固定种子 ${DATA.selection_seed}，每组按原评估的完整 ${DATA.evaluation_envs||512} 环境批次回放，核对全部场景的终止记录一致。`;
const buttons=cases.map((c,i)=>{const b=document.createElement('button');b.innerHTML=`${String(i+1).padStart(2,'0')} · ${c.label}<small><span class="${c.finished?'ok':'bad'}">${c.finished?'通过':'失败'}</span> · ${c.seconds.toFixed(2)} 秒</small>`;b.onclick=()=>choose(i);$('cases').appendChild(b);return b});
function indexAt(c,t){let lo=0,hi=c.frames.length;while(lo<hi){let m=(lo+hi)>>1;if(c.frames[m][F.t]<=t)lo=m+1;else hi=m}return Math.max(0,lo-1)}
function transform(c,w,h,r){let cx,cy,s;if(r){s=Math.min(w,h)/2800;cx=r[F.x]+450;cy=r[F.y]+450}else{let x0=Math.min(...c.rects.map(v=>v[0]))-100,y0=Math.min(...c.rects.map(v=>v[1]))-100,x1=Math.max(...c.rects.map(v=>v[2]))+100,y1=Math.max(...c.rects.map(v=>v[3]))+100;s=Math.min((w-36)/(x1-x0),(h-36)/(y1-y0));cx=(x0+x1)/2;cy=(y0+y1)/2}return(x,y)=>[w/2+(x-cx)*s,h/2-(y-cy)*s]}
function drawMap(canvas,c,index,follow){const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,r=c.frames[index],p=transform(c,w,h,follow?r:null);ctx.fillStyle='#08101b';ctx.fillRect(0,0,w,h);function rect(v,fill,outline){let a=p(v[0],v[3]),b=p(v[2],v[1]);ctx.fillStyle=fill;ctx.fillRect(...a,b[0]-a[0],b[1]-a[1]);if(outline){ctx.strokeStyle=outline;ctx.lineWidth=1;ctx.strokeRect(...a,b[0]-a[0],b[1]-a[1])}}c.rects.forEach(v=>rect(v,'#3d5873','#7992aa'));c.ramps.forEach(v=>rect(v[0]===0?[v[1],v[3],v[2],v[4]]:[v[3],v[1],v[4],v[2]],'#966b37','#e9b16c'));(c.reliefs||[]).forEach(v=>{for(let k=0;k<16;k++){const a=v[1]+(v[2]-v[1])*k/16,b=v[1]+(v[2]-v[1])*(k+1)/16,t=Math.sin(Math.PI*(k+.5)/16)**2,peak=v[5]>0?[154,115,63]:[66,120,151],rgb=[61,88,115].map((x,i)=>Math.round(x+(peak[i]-x)*t));rect(v[0]===0?[a,v[3],b,v[4]]:[v[3],a,v[4],b],`rgb(${rgb.join(',')})`)}});c.holes.forEach(v=>rect(v,'#08101b'));c.jumps.forEach(v=>{for(let [along,color] of [[v[1],'#ffd382'],[v[2],'#80caff']]){let a=v[0]===0?p(along,v[3]):p(v[3],along),b=v[0]===0?p(along,v[4]):p(v[4],along);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}});for(let k=follow?Math.max(1,index-180):1;k<=index;k++){let a=c.frames[k-1],b=c.frames[k];ctx.strokeStyle=b[F.command]?'#ff9477':'#36d6b3';ctx.lineWidth=follow?3:2;ctx.beginPath();ctx.moveTo(...p(a[F.x],a[F.y]));ctx.lineTo(...p(b[F.x],b[F.y]));ctx.stroke()}for(let [v,color]of[[c.frames[0].slice(1,3),'#6de0a0'],[c.corners.at(-1),'#cbd8eb']]){ctx.fillStyle=color;ctx.beginPath();ctx.arc(...p(...v),4,0,Math.PI*2);ctx.fill()}let [x,y]=p(r[F.x],r[F.y]),rad=follow?13:7;for(let [yes,extra,color]of[[r[F.air],5,'#80caff'],[r[F.boost]>0,9,'#ffd382']])if(yes){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,rad+extra,0,Math.PI*2);ctx.stroke()}ctx.save();ctx.translate(x,y);ctx.rotate(r[F.theta]);ctx.fillStyle='#f0f5fc';ctx.strokeStyle='#0e1726';ctx.beginPath();ctx.moveTo(0,-rad*1.6);ctx.lineTo(rad*.8,rad*.7);ctx.lineTo(-rad*.8,rad*.7);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();if(index===c.frames.length-1&&!c.finished){ctx.strokeStyle='#ff7885';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-rad,y-rad);ctx.lineTo(x+rad,y+rad);ctx.moveTo(x-rad,y+rad);ctx.lineTo(x+rad,y-rad);ctx.stroke()}}
function render(){const c=cases[selected],index=indexAt(c,now),r=c.frames[index],ended=index===c.frames.length-1;drawMap($('follow'),c,index,true);drawMap($('whole'),c,index,false);const ctx=$('input').getContext('2d'),oi=Math.min(c.observation_count-1,Math.max(0,Math.round(r[F.observation])));ctx.fillStyle='#808080';ctx.fillRect(0,0,288,288);if(sprite.complete&&sprite.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(sprite,(oi%c.sprite_columns)*48,Math.floor(oi/c.sprite_columns)*48,48,48,0,0,288,288)}let st=c.observed_states[oi];if(st){ctx.save();ctx.translate(144,144);ctx.rotate(Math.atan2(st[0],st[1]));ctx.fillStyle='#ff9477';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(7,7);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();ctx.restore()}let state=ended?(c.finished?'通过':c.timeout?'超过时限':c.unknown?'地图未知':r[F.unsafe_landing]?'落地余量不足':'离路失败'):(r[F.air]?'腾空':'地面／坡面');$('clock').textContent=`${now.toFixed(2)} / ${c.seconds.toFixed(2)} 秒`;$('scrub').value=now;$('play').textContent=playing?'暂停':'播放';$('action').textContent=r[F.command]?'按住屏幕 · B':'松开屏幕 · A';$('action').style.color=r[F.command]?'var(--b)':'var(--a)';$('stats').innerHTML=[['状态',state],['速度',r[F.speed].toFixed(0)],['真实航向',(r[F.theta]*180/Math.PI).toFixed(1)+'°'],['模型估计航向',st?(Math.atan2(st[0],st[1])*180/Math.PI).toFixed(1)+'°':'--'],['高度',r[F.height].toFixed(0)],['生效输入',r[F.effective]?'B':'A'],['加速',r[F.boost]>0?'正在加速':'无']].map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');$('endnote').textContent=`本例起跳 ${c.launches} 次，安全落地 ${c.safe_landings} 次。`}
function choose(i){selected=i;now=0;playing=false;lastStamp=null;buttons.forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));const c=cases[i];$('title').textContent=`地图 ${String(i+1).padStart(2,'0')} · ${c.label} · 跟随视图（A ↑ B →）`;$('scrub').max=c.seconds;const modes={responsive:'空中响应输入候选',latched:'起跳后锁向候选',frozen_heading:'空中保持航向候选'};$('result').innerHTML=`终局：<strong class="${c.finished?'ok':'bad'}">${c.finished?'通过':'失败'}</strong><br>到达 ${Math.min(100,c.progress_fraction*100).toFixed(1)}% · ${c.seconds.toFixed(2)} 秒`+(c.air_control_mode?`<br>${modes[c.air_control_mode]||c.air_control_mode}`:'');$('video').href=c.video;sprite=new Image();sprite.onload=()=>render();sprite.src=c.sprite;$('model').textContent='模型 SHA-256：'+DATA.model_sha256;render()}
$('play').onclick=()=>{if(now>=cases[selected].seconds)now=0;playing=!playing;lastStamp=null;render()};$('restart').onclick=()=>{now=0;playing=false;render()};$('ending').onclick=()=>{now=cases[selected].seconds;playing=false;render()};$('scrub').oninput=e=>{now=+e.target.value;playing=false;render()};function nextEvent(test){const c=cases[selected],start=indexAt(c,now);for(let k=start+1;k<c.frames.length;k++)if(test(c.frames[k],c.frames[k-1])){now=c.frames[k][F.t];playing=false;render();return}}$('switch').onclick=()=>nextEvent((r,p)=>r[F.command]!==p[F.command]);$('jump').onclick=()=>nextEvent(r=>r[F.launch]||r[F.land]);
function tick(stamp){if(playing){if(lastStamp!==null)now=Math.min(cases[selected].seconds,now+(stamp-lastStamp)/1000*Number($('speed').value));if(now>=cases[selected].seconds)playing=false;render()}lastStamp=stamp;requestAnimationFrame(tick)}choose(0);requestAnimationFrame(tick);
</script></html>
